services:
  - type: web
    name: mp3juice-service
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SERVE_FRONTEND
        value: "true"
      - key: ALLOWED_ORIGIN
        value: "*"
